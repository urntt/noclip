plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
	maven {
		name = 'Polyfrost'
		url = 'https://repo.polyfrost.org/releases/'
		content {
			includeGroup 'org.polyfrost.oneconfig'
		}
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"noclip" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "noclip-gametest"
		enableGameTests = false
		enableClientGameTests = true
		// The multiplayer game tests start a local dedicated server, which only runs once the Minecraft EULA is accepted.
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu is optional: compile against it, and load it only in the development client.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// OneConfig is optional: compile against the parts of its API that the integration uses.
	// Its many transitive dependencies are only needed at runtime, where OneConfig provides them.
	["config", "config-impl", "poly-compose", "ui"].each { module ->
		clientCompileOnly("org.polyfrost.oneconfig:${module}:${project.oneconfig_version}") {
			transitive = false
		}
	}

	// With -PoneConfigRuntime=true, the development client and the client game tests run with OneConfig installed.
	if (providers.gradleProperty("oneConfigRuntime").map { it.toBoolean() }.getOrElse(false)) {
		localRuntime "maven.modrinth:oneconfig:${project.oneconfig_modrinth_id}"
		localRuntime "maven.modrinth:fabric-language-kotlin:${project.fabric_language_kotlin_modrinth_id}"
		localRuntime "maven.modrinth:polycompose:${project.polycompose_modrinth_id}"
	}

	// Lithium replaces the game's entity collision code. Pass -PwithLithium to load it in the development client
	// and run the client game tests against it; it is never a dependency of the mod itself.
	if (providers.gradleProperty("withLithium").present) {
		localRuntime "maven.modrinth:lithium:${project.lithium_version}"
	}
}

def javaVersion = project.java_version as int

// Values from gradle.properties that are substituted into resource files.
def resourceProperties = [
	version: project.version,
	minecraft_version: project.minecraft_version,
	loader_version: project.loader_version,
	fabric_api_version: project.fabric_api_version,
	java_version: project.java_version,
]

processResources {
	inputs.properties resourceProperties

	filesMatching("fabric.mod.json") {
		expand resourceProperties
	}
}

processClientResources {
	inputs.properties resourceProperties

	filesMatching("*.mixins.json") {
		expand resourceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
